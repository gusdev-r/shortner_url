version: "3.8"

services:
  server:
    container_name: enx-server
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db

  client:
    container_name: enx-client
    build:
      context: ./client
    env_file:
      - ./client/.env
    ports:
      - "4173:4173"
    restart: unless-stopped
    links:
      - server

  db:
    container_name: enx-db
    image: postgres:14-alpine
    env_file:
      - ./db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
